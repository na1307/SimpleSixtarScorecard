# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published

env:
  ARTIFACT_NAME: Release

jobs:
  build:
    name: .NET
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    outputs:
      artifact_id: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }} #hash of project files
          restore-keys: ${{ runner.os }}-nuget-
      - name: Restore
        run: dotnet restore -r win-x64
      - name: Build (Debug)
        run: dotnet build -c Debug --no-restore
      - name: Publish (Release)
        run: |
          dotnet publish SimpleSixtarScorecard -c Release --no-restore -o _out
          dotnet publish SimpleSixtarScorecard.Updater -c Release --no-restore -o _out
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        id: upload-artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: _out

  publish:
    name: Publish
    if: github.event_name == 'release'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: _out
      - name: Compress
        shell: pwsh
        run: |
          cd _out
          del *.pdb
          7z a -mx9 ..\SimpleSixtarScorecard_${{ github.event.release.tag_name }}.7z
          cd ..
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: '*.7z'
      - name: Dispatch Publish Symbols Event
        run: gh workflow run publish-symbols.yml -f repository=${{ github.repository }} -f run_id=${{ github.run_id }} -f artifact_name=${{ env.ARTIFACT_NAME }} -f product_name=${{ github.event.repository.name }} -f version=${{ github.ref_name }} -r main -R na1307/bluehillsymbols
        env:
          GH_TOKEN: ${{ secrets.BS_PAT }}
